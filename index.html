<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Flipword</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0FA;--surf:#fff;--ink:#14173A;--mute:#6B6F94;--line:#DCE0F3;--acc:#3B49F5;--yel:#FFD54A;--ok:#14A870;--bad:#E8435F;color-scheme:light}
[data-theme=dark]{--bg:#0F1020;--surf:#1A1C33;--ink:#EEF0FF;--mute:#9A9EC4;--line:#2A2D4C;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);height:100%}
body{height:100vh;height:100dvh;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 Onest,system-ui,-apple-system,sans-serif}
main{flex:1;overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* tabs */
nav{display:flex;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--surf);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px;border-radius:14px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
nav button[aria-selected=true]{background:var(--acc);color:#fff}

/* progress */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:14px;color:var(--mute)}
.bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .5s}

/* card */
.scene{perspective:1200px;flex:0 0 auto}
.card{position:relative;height:min(44vh,380px);height:min(44dvh,380px);min-height:250px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.card.flip{transform:rotateY(180deg)}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.face{position:absolute;inset:0;border-radius:30px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px -18px rgba(20,23,58,.45)}
.front{background:var(--acc);color:#fff}
.back{background:var(--yel);color:#14173A;transform:rotateY(180deg)}
.cap{font-size:14px;opacity:.75}
.word{font:600 clamp(28px,9vw,42px)/1.15 Unbounded,Onest,system-ui,sans-serif;overflow-wrap:anywhere}
.en,.ex{font-size:15px;opacity:.8}
.ex{font-style:italic}
.hint{min-height:24px;font:500 20px Unbounded,Onest,sans-serif;letter-spacing:.2em;opacity:.9}

/* controls */
.controls{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.field{width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--surf);font-size:18px;transition:border-color .2s}
.field.bad{border-color:var(--bad)}
.field:focus{outline:none;border-color:var(--acc)}
.btn{width:100%;padding:16px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:600;font-size:17px}
.btn.acc{background:var(--acc);color:#fff}
.btn:active{transform:scale(.98)}
.row{display:flex;justify-content:space-between}
.link{color:var(--mute);padding:6px 4px;font-size:15px}
.msg{min-height:22px;text-align:center;font-weight:500}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}

/* list */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font:600 22px Unbounded,Onest,sans-serif}
.add{background:var(--acc);color:#fff;border-radius:14px;padding:10px 16px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.item b{display:block;font-weight:600}
.item span{color:var(--mute);font-size:15px}
.item>div{flex:1;min-width:0}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:300px}
.empty h2{font:600 20px Unbounded,Onest,sans-serif}
.empty p{color:var(--mute)}

/* sheet */
.wrap{position:fixed;inset:0;background:rgba(10,11,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{max-height:92vh;max-height:92dvh;overflow-y:auto;width:100%;max-width:560px;background:var(--surf);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font:600 18px Unbounded,Onest,sans-serif}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
textarea.field{min-height:150px;resize:none}
.danger{color:var(--bad);font-weight:600;padding:8px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:500;z-index:20;animation:fade .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.modes{margin-bottom:14px}
.boxes{display:flex;gap:6px;margin-bottom:10px}
.boxes div{flex:1;text-align:center;padding:8px 0 6px;border-radius:12px;background:var(--surf);border:2px solid var(--line);font-size:11px;color:var(--mute);transition:border-color .3s}
.boxes div.on{border-color:var(--acc)}
.boxes b{display:block;font:600 17px Unbounded,Onest,sans-serif;color:var(--ink)}
.sub{text-align:center;color:var(--mute);font-size:14px;margin-bottom:14px}
.ipa{font:500 18px Onest,sans-serif;opacity:.85;min-height:24px}
.spk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);color:inherit}
.back .spk{background:rgba(20,23,58,.12)}
.spk:active{transform:scale(.92)}
button{touch-action:manipulation}
main{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.card{-webkit-transform-style:preserve-3d}
.back{pointer-events:none}.card.flip .back{pointer-events:auto}.card.flip .front{pointer-events:none}
.item{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.item.sel{border-color:var(--acc)}
.chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--mute);flex:none;display:grid;place-items:center}
.chk.on{background:var(--acc);border-color:var(--acc)}
.chk.on::after{content:'✓';color:#fff;font-size:13px;font-weight:700}
.selbar{position:sticky;bottom:-24px;margin:12px -20px -24px;padding:12px 20px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:10px}
.btn.del{background:var(--bad);color:#fff}
.btn:disabled{opacity:.4}
.modes{overflow-x:auto;scrollbar-width:none}.modes::-webkit-scrollbar{display:none}
.modes button{flex:none;white-space:nowrap;padding:9px 12px}
.opts{display:grid;gap:8px}
.opt{background:var(--surf);color:var(--ink);border:2px solid var(--line);font-weight:500}
.opt.wrong{border-color:var(--bad);opacity:.5}
.sent{font:500 clamp(18px,5.4vw,24px)/1.4 Onest,sans-serif;overflow-wrap:anywhere}
.mn{font-size:14px;opacity:.9}
.face{gap:10px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles div{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--mute);font-size:13px}
.tiles b{display:block;font:600 22px Unbounded,Onest,sans-serif;color:var(--ink);margin-bottom:2px}
.chart{display:flex;gap:8px;align-items:flex-end;margin-top:20px;min-height:150px}
.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
.chart i{width:100%;background:var(--acc);border-radius:8px 8px 4px 4px}
</style>
</head>
<body>
<main id="view"></main>
<nav role="tablist">
  <button role="tab" id="t-study" aria-selected="true">Учить</button>
  <button role="tab" id="t-words" aria-selected="false">Слова</button>
  <button role="tab" id="t-stats" aria-selected="false">Прогресс</button>
</nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const scheme = inTg ? tg.colorScheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme = scheme;
try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  const c = scheme === 'dark' ? '#0F1020' : '#EEF0FA'; tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}

const $ = s => document.querySelector(s);
function showErr(m) {
  let b = $('#err');
  if (!b) { b = document.createElement('div'); b.id = 'err'; b.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:99;background:#E8435F;color:#fff;padding:10px 12px;border-radius:12px;font-size:13px;word-break:break-word'; b.onclick = () => b.remove(); document.body.append(b); }
  b.textContent = 'v7 · ' + m;
}
addEventListener('error', e => showErr(e.message + ' (стр. ' + (e.lineno || '?') + ')'));
addEventListener('unhandledrejection', e => showErr(String(e.reason)));
const FINE = matchMedia('(pointer:fine)').matches; // на телефоне не открываем клавиатуру автоматически
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9\s]/g, '').replace(/\s+/g, ' ').trim();
const strip = s => s.replace(/^to /, '');
const buzz = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const SPK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- хранилище ---------- */
const cs = inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
let cards = [];
const local = () => { try { localStorage.setItem('fw_cards', JSON.stringify(cards)); } catch (e) {} };
const store = {
  load: () => new Promise(res => {
    if (cs) {
      cs.getKeys((e, keys) => {
        keys = (keys || []).filter(k => k.startsWith('c_'));
        if (e || !keys.length) return res([]);
        cs.getItems(keys, (e2, vals) => res(Object.values(vals || {}).map(v => { try { return JSON.parse(v); } catch (x) { return null; } }).filter(Boolean)));
      });
    } else { try { res(JSON.parse(localStorage.getItem('fw_cards') || '[]')); } catch (e) { res([]); } }
  }),
  save: c => cs ? cs.setItem('c_' + c.id, JSON.stringify(c)) : local(),
  remove: id => cs ? cs.removeItem('c_' + id) : local()
};

/* ---------- метод Лейтнера: 5 коробок, интервалы в днях ---------- */
const DAYS = [0, 1, 3, 7, 14], NEW_LIMIT = 10, GOAL = 20, SESS = 20, DIRS = ['f', 'r', 'd', 'c'];
const schedule = (u, b) => { u.b = b; u.d = Date.now() + DAYS[b - 1] * 864e5; };
const migrate = c => { DIRS.forEach(k => { c[k] = c[k] || { b: 1, d: 0 }; if (c[k].d > 0) c[k].s = 1; }); c.lp = c.lp || 0; return c; };
let st = { d: {} };
const loadSt = () => new Promise(res => { const p = v => { try { const o = JSON.parse(v || '{}'); res(o.d ? o : { d: {} }); } catch (e) { res({ d: {} }); } }; cs ? cs.getItem('st', (e, v) => p(v)) : p(localStorage.getItem('fw_st')); });
const saveSt = () => { const ks = Object.keys(st.d).sort(); ks.slice(0, Math.max(0, ks.length - 100)).forEach(k => delete st.d[k]); const j = JSON.stringify(st); if (cs) cs.setItem('st', j); else try { localStorage.setItem('fw_st', j); } catch (e) {} };
const day = t => new Date(t).toLocaleDateString('sv');
const today = () => st.d[day(Date.now())] || [0, 0, 0];
function rec(ok, nw) { const k = day(Date.now()), x = st.d[k] = st.d[k] || [0, 0, 0]; x[0]++; if (ok) x[1]++; if (nw) x[2]++; saveSt(); }
function streak() { let n = 0, t = Date.now(); if (!(st.d[day(t)] || [0])[0]) t -= 864e5; while ((st.d[day(t)] || [0])[0]) { n++; t -= 864e5; } return n; }
let syncT;
function sync() {
  if (!inTg || !location.protocol.startsWith('http')) return;
  clearTimeout(syncT);
  syncT = setTimeout(() => {
    const dirs = mode === 'hard' ? DIRS : MD[mode], h = {};
    const U = cards.flatMap(c => dirs.filter(k => k !== 'c' || cloze(c)).map(k => c[k]));
    U.filter(x => x.s).forEach(x => { const k = Math.floor(x.d / 36e5); h[k] = (h[k] || 0) + 1; });
    fetch('/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: tg.initData, on: st.rem !== false, h, nw: Math.min(NEW_LIMIT, U.filter(x => !x.s).length) }) }).catch(() => {});
  }, 1500);
}
const lev = (a, b) => { const d = Array.from({ length: b.length + 1 }, (_, j) => j); for (let i = 1; i <= a.length; i++) { let p = d[0]; d[0] = i; for (let j = 1; j <= b.length; j++) { const t = d[j]; d[j] = Math.min(d[j] + 1, d[j - 1] + 1, p + (a[i - 1] === b[j - 1] ? 0 : 1)); p = t; } } return d[b.length]; };
const first = s => s.split(/[,;/]/)[0].trim();
const lab = (x, d) => d === 'f' ? first(x.ru) : d === 'c' ? strip(x.en.toLowerCase().trim()) : x.en;
function cloze(c) {
  const b = strip(c.en.toLowerCase().trim()); if (!c.ex || !b) return null;
  const m = c.ex.match(new RegExp('\\b' + b.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '\\w*', 'i'));
  return m ? { q: c.ex.replace(m[0], '_____'), a: m[0], b } : null;
}
async function tr(w) {
  try {
    const j = await (await fetch('https://api.mymemory.translated.net/get?q=' + encodeURIComponent(w) + '&langpair=en|ru')).json();
    const t = (j.responseData || {}).translatedText || '';
    return /MYMEMORY|QUERY LENGTH/i.test(t) ? '' : t.toLowerCase().replace(/\.$/, '');
  } catch (e) { return ''; }
}

let tab = 'study', cur = null, lastId = null, tries = 0, hintOn = false, extra = false;
let mode = 'f'; try { mode = localStorage.getItem('fw_mode') || 'f'; } catch (e) {}
const MD = { f: ['f'], r: ['r'], d: ['d'], c: ['c'], mix: DIRS, hard: DIRS };
if (!MD[mode]) mode = 'f';
const units = () => cards.filter(c => mode !== 'hard' || c.lp >= 3).flatMap(c => MD[mode].filter(k => k !== 'c' || cloze(c)).map(dir => ({ c, dir })));
const newLeft = () => Math.max(0, NEW_LIMIT - today()[2]);
const dueUnits = () => { let nl = newLeft(); const now = Date.now(); return units().filter(u => { const x = u.c[u.dir]; return x.d <= now && (x.s || nl-- > 0); }); };
function pick() {
  let list = mode === 'hard' ? units() : dueUnits();
  if (!list.length && extra) list = units();
  if (!list.length) return null;
  const other = list.filter(u => u.c.id !== lastId); if (other.length) list = other;
  const min = Math.min(...list.map(u => u.c[u.dir].b));
  const low = list.filter(u => u.c[u.dir].b === min);
  return low[Math.floor(Math.random() * low.length)];
}
const nextIn = () => {
  const h = Math.ceil((Math.min(...units().map(u => u.c[u.dir].d)) - Date.now()) / 36e5);
  return h < 24 ? `через ${Math.max(1, h)} ч` : `через ${Math.round(h / 24)} дн.`;
};

/* ---------- озвучка и транскрипция ---------- */
function speak(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith('en-US')) || speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
    if (v) u.voice = v; speechSynthesis.speak(u);
  } catch (e) {}
}
async function ensureIpa(c) {
  if (c.ipa !== undefined) return;
  const words = c.en.toLowerCase().replace(/^to\s+/, '').replace(/[^a-z'\s-]/g, '').trim().split(/\s+/).filter(Boolean).slice(0, 4);
  let out = [];
  try {
    for (const w of words) {
      const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w));
      if (!r.ok) { out = null; break; }
      const e = (await r.json())[0];
      if (words.length === 1 && !c.ex) { const x = (e.meanings || []).flatMap(m => m.definitions || []).map(d => d.example).find(Boolean); if (x) c.ex = x; }
      const p = e.phonetic || (e.phonetics.find(x => x.text) || {}).text;
      if (!p) { out = null; break; }
      out.push(p.replace(/^\/|\/$/g, ''));
    }
  } catch (e) { return; } // нет сети — попробуем позже
  c.ipa = out && out.length ? '/' + (/^to\s/i.test(c.en) ? 'tə ' : '') + out.join(' ') + '/' : '';
  store.save(c);
  if (cur && cur.c === c) document.querySelectorAll('.ipa').forEach(n => n.textContent = c.ipa);
}

/* ---------- экраны ---------- */
function render() {
  ['study', 'words', 'stats'].forEach(t => $('#t-' + t).setAttribute('aria-selected', tab === t));
  tab === 'study' ? renderStudy() : tab === 'words' ? renderWords() : renderStats();
  sync();
}
function emptyState() {
  $('#view').innerHTML = `<div class="empty"><h2>Пока нет карточек</h2><p>Создай первую карточку или добавь сразу много слов списком.</p>
  <button class="btn acc" id="own">Создать карточку</button><button class="btn" id="bulk">Добавить списком</button></div>`;
  $('#own').onclick = () => openSheet(); $('#bulk').onclick = () => openSheet(null, 'many');
}
const MODES = [['f', 'EN → RU'], ['r', 'RU → EN'], ['d', '🎧 Слух'], ['c', 'Пропуск'], ['mix', 'Микс'], ['hard', 'Трудные']];
function statHTML() {
  const U = units(), cb = cur && cur.c[cur.dir].b;
  return `<div class="boxes">${[1, 2, 3, 4, 5].map(n => `<div class="${cb === n ? 'on' : ''}"><b>${U.filter(u => u.c[u.dir].b === n).length}</b>коробка ${n}</div>`).join('')}</div>
  <p class="sub">К повторению: ${mode === 'hard' ? U.length : dueUnits().length} · сегодня ${today()[0]}/${GOAL} · 🔥 ${streak()}</p>`;
}
function studyHead() {
  const hn = cards.filter(c => c.lp >= 3).length;
  return `<div class="seg modes">${MODES.map(([m, t]) => `<button data-mode="${m}" aria-pressed="${mode === m}">${t}${m === 'hard' && hn ? ' · ' + hn : ''}</button>`).join('')}</div><div id="stat">${statHTML()}</div>`;
}
let sess = 0;
function bindHead() {
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    mode = b.dataset.mode; try { localStorage.setItem('fw_mode', mode); } catch (e) {}
    cur = null; extra = false; sess = 0; renderStudy();
  });
}
function info(title, text, btn, fn) {
  $('#view').innerHTML = studyHead() + `<div class="empty"><h2>${title}</h2><p>${text}</p>${btn ? `<button class="btn" id="more">${btn}</button>` : ''}</div>`;
  bindHead(); if (btn) $('#more').onclick = fn;
}
function shake() { const k = $('#card'); k.classList.remove('shake'); void k.offsetWidth; k.classList.add('shake'); }

function renderStudy() {
  if (!cards.length) return emptyState();
  if (!cur && sess >= SESS) { const t = today(); return info('Сессия завершена 🎉', `Ответов сегодня: ${t[0]}, верных: ${t[1]}. Короткие занятия работают лучше марафонов.`, 'Продолжить', () => { sess = 0; renderStudy(); }); }
  if (!cur) { cur = pick(); tries = 0; hintOn = false; }
  if (!cur) {
    if (!units().length) return info('Здесь пока пусто', mode === 'hard' ? 'Сюда попадают слова, в которых ты ошибся 3 раза. Пока таких нет.' : 'Нет подходящих карточек. Для режима «Пропуск» нужны примеры предложений с этим словом.');
    return info('На сегодня всё', `Следующее повторение ${nextIn()}. Новых карточек в день: ${NEW_LIMIT}.`, 'Повторить всё равно', () => { extra = true; renderStudy(); });
  }
  const c = cur.c, dir = cur.dir, u = c[dir], z = dir === 'c' ? cloze(c) : null;
  const spk = `<button class="spk" aria-label="Озвучить" data-say>${SPK}</button>`, ipa = `<p class="ipa">${esc(c.ipa || '')}</p>`, hint = '<p class="hint" id="hint"></p>';
  const front = {
    f: `<p class="cap">Переведи на русский</p><h2 class="word">${esc(c.en)}</h2>${ipa}${spk}${hint}`,
    r: `<p class="cap">Переведи на английский</p><h2 class="word">${esc(c.ru)}</h2>${hint}`,
    d: `<p class="cap">Послушай и напиши по-английски</p>${spk}${hint}`,
    c: `<p class="cap">Вставь пропущенное слово</p><h2 class="sent">${esc(z ? z.q : '')}</h2><p class="en">${esc(c.ru)}</p>${hint}`
  }[dir];
  const bw = dir === 'f' ? `<h2 class="word">${esc(c.ru)}</h2><p class="en">${esc(c.en)}</p>` : `<h2 class="word">${esc(c.en)}</h2>${ipa}${spk}<p class="en">${esc(c.ru)}</p>`;
  const back = `<p class="cap">Ответ</p>${bw}${c.ex ? `<p class="ex">${esc(c.ex)}</p>` : ''}${c.mn ? `<p class="mn">💡 ${esc(c.mn)}</p>` : ''}`;
  const right = lab(c, dir);
  const others = [...new Set(cards.filter(x => x !== c).map(x => lab(x, dir)))].filter(x => x && norm(x) !== norm(right)).sort(() => Math.random() - .5).slice(0, 3);
  const choice = !u.s && others.length >= 3;
  const opts = [right, ...others].sort(() => Math.random() - .5);
  const ctl = choice
    ? `<div class="opts">${opts.map(o => `<button class="btn opt" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div><p class="msg" id="msg"></p><div class="row"><span></span><button class="link" id="giveup">Показать ответ</button></div>`
    : `<input class="field" id="ans" lang="${dir === 'f' ? 'ru' : 'en'}" placeholder="${dir === 'f' ? 'Введи перевод' : 'Введи по-английски'}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <p class="msg" id="msg"></p><button class="btn acc" id="check">Проверить</button>
      <div class="row"><button class="link" id="hintBtn">Подсказка</button><button class="link" id="giveup">Показать ответ</button></div>`;
  $('#view').innerHTML = studyHead() + `<div class="scene"><div class="card" id="card"><div class="face front">${front}</div><div class="face back">${back}</div></div></div><div class="controls" id="ctl">${ctl}</div>`;
  bindHead();
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); speak(c.en); });
  $('#giveup').onclick = () => reveal(false);
  if (choice) {
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (norm(b.dataset.o) === norm(right)) return reveal(true);
      tries++; buzz('error'); shake(); b.disabled = true; b.classList.add('wrong');
    });
  } else {
    const ans = $('#ans');
    ans.onkeydown = e => { if (e.key === 'Enter') check(); };
    $('#check').onclick = check;
    $('#hintBtn').onclick = () => {
      const v = answersOf(cur)[0].trim();
      $('#hint').textContent = v[0] + ' ' + '• '.repeat(Math.max(0, v.length - 1)).trim();
      hintOn = true; if (FINE) ans.focus();
    };
    if (FINE) ans.focus({ preventScroll: true });
    ans.onfocus = () => setTimeout(() => ans.scrollIntoView({ block: 'center', behavior: 'smooth' }), 350);
  }
  ensureIpa(c);
  if (dir === 'd') setTimeout(() => speak(c.en), 300);
}

function answersOf(u) {
  const c = u.c;
  if (u.dir === 'f') return [...c.ru.split(/[,;/]/), c.ru];
  if (u.dir === 'c') { const z = cloze(c); return [z.a, z.b]; }
  return c.en.split(/[,;/]/);
}
const isOk = v => answersOf(cur).map(norm).filter(Boolean).some(a => a === v || (cur.dir !== 'f' && strip(a) === strip(v)));
const near = v => answersOf(cur).map(norm).filter(a => a.length >= 5).some(a => lev(a, v) === 1);
function check() {
  const v = norm($('#ans').value);
  if (!v) return;
  if (isOk(v)) return reveal(true);
  if (near(v)) return reveal(true, true);
  tries++; buzz('error'); shake();
  $('#ans').classList.add('bad');
  $('#msg').className = 'msg bad'; $('#msg').textContent = 'Не совсем. Попробуй ещё раз';
  setTimeout(() => $('#ans') && $('#ans').classList.remove('bad'), 700);
}
function reveal(correct, typo) {
  const c = cur.c, u = c[cur.dir], clean = correct && tries === 0 && !hintOn && !typo, prac = extra || mode === 'hard', wasNew = !u.s;
  let note = '';
  if (!prac) {
    schedule(u, clean ? Math.min(5, u.b + 1) : correct ? u.b : 1); u.s = 1;
    note = ` · коробка ${u.b}, ${DAYS[u.b - 1] ? 'повтор через ' + DAYS[u.b - 1] + ' дн.' : 'повтор в этой сессии'}`;
  }
  if (!correct) { c.lp = (c.lp || 0) + 1; if (c.lp === 3) toast('Слово добавлено в «Трудные»'); }
  if (mode === 'hard' && clean) c.lp = Math.max(0, c.lp - 1);
  store.save(c); rec(correct, wasNew && !prac);
  if (correct) buzz('success');
  const msg = typo ? `Почти! Правильно: «${answersOf(cur)[0].trim()}»` : correct ? (clean ? 'Верно!' : 'Верно, но с подсказкой или ошибкой') : 'Вернётся в коробку 1';
  $('#card').classList.add('flip');
  $('#ctl').innerHTML = `<p class="msg ${correct ? 'ok' : ''}">${msg}${note}</p><button class="btn acc" id="next">Дальше</button>`;
  const n = $('#next'); if (FINE) n.focus(); n.onclick = next;
  $('#stat').innerHTML = statHTML();
  speak(c.en); sync();
}
function next() {
  lastId = cur.c.id; cur = null; sess++;
  $('#card').classList.remove('flip');
  setTimeout(renderStudy, 250);
}

function renderStats() {
  const days = [...Array(7)].map((_, i) => { const t = Date.now() - (6 - i) * 864e5; return [new Date(t).toLocaleDateString('ru', { weekday: 'short' }), st.d[day(t)] || [0, 0, 0]]; });
  const max = Math.max(GOAL, ...days.map(d => d[1][0])), all = Object.values(st.d);
  const A = all.reduce((s, x) => s + x[0], 0), K = all.reduce((s, x) => s + x[1], 0);
  const w = days.reduce((s, d) => [s[0] + d[1][0], s[1] + d[1][1]], [0, 0]);
  const U = cards.flatMap(c => DIRS.filter(k => k !== 'c' || cloze(c)).map(k => c[k]));
  const pct = (k, a) => a ? Math.round(k / a * 100) + '%' : '—';
  $('#view').innerHTML = `<div class="top"><h1>Прогресс</h1></div><div class="tiles">
    <div><b>🔥 ${streak()}</b>дней подряд</div><div><b>${today()[0]}/${GOAL}</b>цель на сегодня</div>
    <div><b>${pct(w[1], w[0])}</b>верных за неделю</div><div><b>${pct(K, A)}</b>верных всего</div>
    <div><b>${U.filter(x => x.b === 5).length}/${U.length}</b>в коробке 5</div><div><b>${cards.filter(c => c.lp >= 3).length}</b>трудных слов</div></div>
  <div class="chart">${days.map(([n, x]) => `<div><em>${x[0] || ''}</em><i style="height:${Math.max(3, Math.round(x[0] / max * 100))}px"></i><span>${n}</span></div>`).join('')}</div>${inTg ? `<button class="btn" id="rem" style="margin-top:22px">${st.rem !== false ? '🔔 Напоминания включены' : '🔕 Напоминания выключены'}</button><p class="sub" style="margin-top:8px">Раз в день бот напишет, если есть что повторять.</p>` : ''}`;
  if (inTg) $('#rem').onclick = () => { st.rem = st.rem === false; saveSt(); sync(); renderStats(); };
}

let sel = null, longp = false;
function delCards(list) {
  const go = ok => {
    if (!ok) return;
    if (cs) cs.removeItems(list.map(c => 'c_' + c.id));
    cards = cards.filter(c => !list.includes(c)); local(); sel = null; cur = null; render();
  };
  const t = list.length === cards.length ? 'Удалить все карточки (' + list.length + ')?' : 'Удалить выбранные карточки (' + list.length + ')?';
  tg && tg.showConfirm && inTg ? tg.showConfirm(t, go) : go(confirm(t));
}
function renderWords() {
  if (!cards.length) { sel = null; return emptyState(); }
  const y = $('#view').scrollTop;
  const list = [...cards].sort((a, b) => b.t - a.t).map(c => `
    <button class="item${sel && sel.has(c.id) ? ' sel' : ''}" data-id="${c.id}">
      ${sel ? `<i class="chk${sel.has(c.id) ? ' on' : ''}"></i>` : ''}
      <div><b>${esc(c.en)}${c.lp >= 3 ? ' ⚑' : ''} <span>${esc(c.ipa || '')}</span></b><span>${esc(c.ru)}</span></div>
      <div class="dots" title="Коробка Лейтнера">${[1, 2, 3, 4, 5].map(n => `<i class="${Math.min(c.f.b, c.r.b) >= n ? 'on' : ''}"></i>`).join('')}</div></button>`).join('');
  const top = sel
    ? `<div class="top"><h1>Выбрано: ${sel.size}</h1><button class="link" id="all">${sel.size === cards.length ? 'Снять все' : 'Выбрать все'}</button></div>`
    : `<div class="top"><h1>Слова · ${cards.length}</h1><div style="display:flex;gap:8px;align-items:center"><button class="link" id="pick">Выбрать</button><button class="add" id="add">Добавить</button></div></div>`;
  const foot = sel
    ? `<div class="selbar"><button class="btn" id="cancelSel">Отмена</button><button class="btn del" id="delSel" ${sel.size ? '' : 'disabled'}>Удалить (${sel.size})</button></div>`
    : `<button class="link" id="clear" style="display:block;margin:14px auto 0">Удалить все слова</button><p class="sub">Flipword v7 · зажми слово, чтобы выбрать несколько</p>`;
  $('#view').innerHTML = top + list + foot;
  $('#view').scrollTop = y;
  if (sel) {
    $('#all').onclick = () => { sel = sel.size === cards.length ? new Set() : new Set(cards.map(c => c.id)); renderWords(); };
    $('#cancelSel').onclick = () => { sel = null; renderWords(); };
    $('#delSel').onclick = () => delCards(cards.filter(c => sel.has(c.id)));
  } else {
    $('#add').onclick = () => openSheet();
    $('#pick').onclick = () => { sel = new Set(); renderWords(); };
    $('#clear').onclick = () => delCards([...cards]);
  }
  document.querySelectorAll('.item').forEach(b => {
    let t;
    const stop = () => clearTimeout(t);
    b.onpointerdown = () => { longp = false; if (!sel) t = setTimeout(() => { longp = true; sel = new Set([b.dataset.id]); try { tg.HapticFeedback.impactOccurred('medium'); } catch (e) {} renderWords(); }, 450); };
    b.onpointerup = b.onpointerleave = b.onpointercancel = stop;
    b.oncontextmenu = e => e.preventDefault();
    b.onclick = () => {
      if (longp) { longp = false; return; }
      if (sel) { sel.has(b.dataset.id) ? sel.delete(b.dataset.id) : sel.add(b.dataset.id); renderWords(); }
      else openSheet(cards.find(c => c.id === b.dataset.id));
    };
  });
}

/* ---------- добавление / редактирование ---------- */
function addCard(en, ru, ex, mn) {
  const c = migrate({ id: uid(), en: en.trim(), ru: ru.trim(), ex: (ex || '').trim(), mn: (mn || '').trim(), t: Date.now() + cards.length });
  cards.push(c); store.save(c); ensureIpa(c); return c;
}
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 1800); }

function openSheet(card, m0) {
  let m = m0 || 'one';
  const el = document.createElement('div'); el.className = 'wrap';
  const draw = () => {
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <h3>${card ? 'Изменить карточку' : 'Новая карточка'}</h3>
      ${card ? '' : `<div class="seg"><button data-m="one" aria-pressed="${m === 'one'}">Одна</button><button data-m="many" aria-pressed="${m === 'many'}">Списком</button></div>`}
      ${m === 'one' ? `
        <input class="field" id="f-en" placeholder="Слово по-английски" autocapitalize="off" autocomplete="off" value="${card ? esc(card.en) : ''}">
        <input class="field" id="f-ru" placeholder="Перевод (несколько через запятую)" autocomplete="off" value="${card ? esc(card.ru) : ''}">
        <input class="field" id="f-ex" placeholder="Пример предложения (необязательно)" autocomplete="off" value="${card ? esc(card.ex || '') : ''}">
        <input class="field" id="f-mn" placeholder="Ассоциация для запоминания (необязательно)" autocomplete="off" value="${card ? esc(card.mn || '') : ''}">`
      : `<textarea class="field" id="f-bulk" placeholder="Каждое слово с новой строки:&#10;apple - яблоко&#10;to run - бегать, бежать&#10;cat (без перевода — подставлю сам)" autocapitalize="off"></textarea>`}
      <button class="btn acc" id="save">Сохранить</button>
      ${card ? '<button class="danger" id="del">Удалить карточку</button>' : ''}
      <button class="link" id="cancel">Отмена</button></div>`;
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { m = b.dataset.m; draw(); });
    el.querySelector('#cancel').onclick = close; el.querySelector('#save').onclick = save;
    const d = el.querySelector('#del'); if (d) d.onclick = remove;
    const f = el.querySelector('#f-en') || el.querySelector('#f-bulk'); FINE && f && f.focus();
    const en = el.querySelector('#f-en');
    if (en) en.onchange = async () => {
      const ru = el.querySelector('#f-ru'); if (ru.value.trim() || !en.value.trim()) return;
      ru.placeholder = 'Ищу перевод…'; const t = await tr(en.value.trim());
      if (t && !ru.value.trim()) ru.value = t; ru.placeholder = 'Перевод (несколько через запятую)';
    };
  };
  const close = () => el.remove();
  const save = async () => {
    if (m === 'one') {
      const en = el.querySelector('#f-en').value.trim(), ru = el.querySelector('#f-ru').value.trim(), ex = el.querySelector('#f-ex').value.trim(), mn = el.querySelector('#f-mn').value.trim();
      if (!en || !ru) return toast('Заполни слово и перевод');
      if (card) { if (card.en !== en) { delete card.ipa; } Object.assign(card, { en, ru, ex, mn }); store.save(card); ensureIpa(card); } else addCard(en, ru, ex, mn);
      toast('Сохранено');
    } else {
      const lines = el.querySelector('#f-bulk').value.split('\n').map(l => l.split(/\s+[-–—]\s+|\t|;|=/).map(s => s.trim())).filter(p => p[0]);
      if (!lines.length) return toast('Формат: слово - перевод');
      toast('Добавляю…'); let n = 0;
      for (const p of lines) { if (!p[1]) p[1] = await tr(p[0]); if (p[1]) { addCard(p[0], p[1], p[2]); n++; } }
      toast('Добавлено: ' + n);
    }
    close(); cur = null; render();
  };
  const remove = () => {
    const go = ok => { if (!ok) return; cards = cards.filter(c => c !== card); store.remove(card.id); local(); close(); cur = null; render(); };
    tg && tg.showConfirm && inTg ? tg.showConfirm('Удалить карточку «' + card.en + '»?', go) : go(confirm('Удалить карточку?'));
  };
  el.onclick = e => { if (e.target === el) close(); };
  draw(); document.body.append(el);
}

$('#t-study').onclick = () => { tab = 'study'; sel = null; render(); };
$('#t-words').onclick = () => { tab = 'words'; sel = null; render(); };
$('#t-stats').onclick = () => { tab = 'stats'; sel = null; render(); };
try { speechSynthesis.getVoices(); } catch (e) {}
let loaded = false;
const boot = c => { if (loaded) return; loaded = true; cards = c.map(migrate); render(); };
$('#view').innerHTML = '<p class="sub" style="margin:auto">Загрузка…</p>';
Promise.all([store.load(), loadSt()]).then(([c, x]) => { st = x; boot(c); }, () => boot([]));
setTimeout(() => { try { boot(JSON.parse(localStorage.getItem('fw_cards') || '[]')); } catch (e) { boot([]); } }, 3000);
</script>
</body>
