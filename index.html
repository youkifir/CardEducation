<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Flipword</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF0FA;--surf:#fff;--ink:#14173A;--mute:#6B6F94;--line:#DCE0F3;--acc:#3B49F5;--yel:#FFD54A;--ok:#14A870;--bad:#E8435F;color-scheme:light}
[data-theme=dark]{--bg:#0F1020;--surf:#1A1C33;--ink:#EEF0FF;--mute:#9A9EC4;--line:#2A2D4C;color-scheme:dark}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);height:100%}
body{height:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.4 Onest,system-ui,-apple-system,sans-serif}
main{flex:1;overflow-y:auto;padding:20px 20px 24px;display:flex;flex-direction:column}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}

/* tabs */
nav{display:flex;gap:6px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));background:var(--surf);border-top:1px solid var(--line)}
nav button{flex:1;padding:12px;border-radius:14px;font-weight:600;color:var(--mute);transition:background .2s,color .2s}
nav button[aria-selected=true]{background:var(--acc);color:#fff}

/* progress */
.prog{display:flex;align-items:center;gap:12px;margin-bottom:18px;font-size:14px;color:var(--mute)}
.bar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:8px;transition:width .5s}

/* card */
.scene{perspective:1200px;flex:0 0 auto}
.card{position:relative;height:min(46vh,340px);min-height:240px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,1.3,.5,1)}
.card.flip{transform:rotateY(180deg)}
.card.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(4px)}}
.face{position:absolute;inset:0;border-radius:30px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 18px 40px -18px rgba(20,23,58,.45)}
.front{background:var(--acc);color:#fff}
.back{background:var(--yel);color:#14173A;transform:rotateY(180deg)}
.cap{font-size:14px;opacity:.75}
.word{font:600 clamp(28px,9vw,42px)/1.15 Unbounded,Onest,system-ui,sans-serif;overflow-wrap:anywhere}
.en,.ex{font-size:15px;opacity:.8}
.ex{font-style:italic}
.hint{min-height:24px;font:500 20px Unbounded,Onest,sans-serif;letter-spacing:.2em;opacity:.9}

/* controls */
.controls{margin-top:22px;display:flex;flex-direction:column;gap:12px}
.field{width:100%;padding:16px 18px;border-radius:18px;border:2px solid var(--line);background:var(--surf);font-size:18px;transition:border-color .2s}
.field.bad{border-color:var(--bad)}
.field:focus{outline:none;border-color:var(--acc)}
.btn{width:100%;padding:16px;border-radius:18px;background:var(--ink);color:var(--bg);font-weight:600;font-size:17px}
.btn.acc{background:var(--acc);color:#fff}
.btn:active{transform:scale(.98)}
.row{display:flex;justify-content:space-between}
.link{color:var(--mute);padding:6px 4px;font-size:15px}
.msg{min-height:22px;text-align:center;font-weight:500}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}

/* list */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.top h1{font:600 22px Unbounded,Onest,sans-serif}
.add{background:var(--acc);color:#fff;border-radius:14px;padding:10px 16px;font-weight:600}
.item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;margin-bottom:8px;border-radius:18px;background:var(--surf);border:1px solid var(--line)}
.item b{display:block;font-weight:600}
.item span{color:var(--mute);font-size:15px}
.item>div{flex:1;min-width:0}
.dots{display:flex;gap:3px}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ok)}
.empty{margin:auto;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;max-width:300px}
.empty h2{font:600 20px Unbounded,Onest,sans-serif}
.empty p{color:var(--mute)}

/* sheet */
.wrap{position:fixed;inset:0;background:rgba(10,11,30,.55);display:flex;align-items:flex-end;justify-content:center;z-index:9;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:560px;background:var(--surf);border-radius:28px 28px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.sheet h3{font:600 18px Unbounded,Onest,sans-serif}
.seg{display:flex;background:var(--bg);border-radius:14px;padding:4px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed=true]{background:var(--surf);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12)}
textarea.field{min-height:150px;resize:none}
.danger{color:var(--bad);font-weight:600;padding:8px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:14px;font-weight:500;z-index:20;animation:fade .2s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.modes{margin-bottom:14px}
.boxes{display:flex;gap:6px;margin-bottom:10px}
.boxes div{flex:1;text-align:center;padding:8px 0 6px;border-radius:12px;background:var(--surf);border:2px solid var(--line);font-size:11px;color:var(--mute);transition:border-color .3s}
.boxes div.on{border-color:var(--acc)}
.boxes b{display:block;font:600 17px Unbounded,Onest,sans-serif;color:var(--ink)}
.sub{text-align:center;color:var(--mute);font-size:14px;margin-bottom:14px}
.ipa{font:500 18px Onest,sans-serif;opacity:.85;min-height:24px}
.spk{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.2);color:inherit}
.back .spk{background:rgba(20,23,58,.12)}
.spk:active{transform:scale(.92)}
</style>
</head>
<body>
<main id="view"></main>
<nav role="tablist">
  <button role="tab" id="t-study" aria-selected="true">Учить</button>
  <button role="tab" id="t-words" aria-selected="false">Слова</button>
</nav>

<script>
const tg = window.Telegram && Telegram.WebApp;
const inTg = !!(tg && tg.initData);
const scheme = inTg ? tg.colorScheme : (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
document.documentElement.dataset.theme = scheme;
try { tg.ready(); tg.expand(); tg.disableVerticalSwipes && tg.disableVerticalSwipes();
  const c = scheme === 'dark' ? '#0F1020' : '#EEF0FA'; tg.setHeaderColor(c); tg.setBackgroundColor(c); } catch (e) {}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const norm = s => s.toLowerCase().replace(/ё/g, 'е').replace(/[^a-zа-я0-9\s]/g, '').replace(/\s+/g, ' ').trim();
const strip = s => s.replace(/^to /, '');
const buzz = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const SPK = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

/* ---------- хранилище ---------- */
const cs = inTg && tg.CloudStorage && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') ? tg.CloudStorage : null;
let cards = [];
const local = () => { try { localStorage.setItem('fw_cards', JSON.stringify(cards)); } catch (e) {} };
const store = {
  load: () => new Promise(res => {
    if (cs) {
      cs.getKeys((e, keys) => {
        keys = (keys || []).filter(k => k.startsWith('c_'));
        if (e || !keys.length) return res([]);
        cs.getItems(keys, (e2, vals) => res(Object.values(vals || {}).map(v => { try { return JSON.parse(v); } catch (x) { return null; } }).filter(Boolean)));
      });
    } else { try { res(JSON.parse(localStorage.getItem('fw_cards') || '[]')); } catch (e) { res([]); } }
  }),
  save: c => cs ? cs.setItem('c_' + c.id, JSON.stringify(c)) : local(),
  remove: id => cs ? cs.removeItem('c_' + id) : local()
};

const STARTER = [
  ['apple','яблоко','I eat an apple every day.'],['book','книга','This book is very interesting.'],
  ['house','дом','They bought a new house.'],['water','вода','Can I have a glass of water?'],
  ['friend','друг, подруга','She is my best friend.'],['to learn','учить, учиться','I want to learn English.'],
  ['beautiful','красивый','What a beautiful day!'],['to work','работать','He works at a bank.'],
  ['street','улица','The street is empty.'],['always','всегда','She is always late.']
];

/* ---------- метод Лейтнера: 5 коробок, интервалы в днях ---------- */
const DAYS = [0, 1, 3, 7, 14];
const schedule = (u, b) => { u.b = b; u.d = Date.now() + DAYS[b - 1] * 864e5; };
const migrate = c => { c.f = c.f || { b: 1, d: 0 }; c.r = c.r || { b: 1, d: 0 }; return c; }; // f: EN→RU, r: RU→EN

let tab = 'study', cur = null, lastId = null, tries = 0, hintOn = false, extra = false;
let mode = 'f'; try { mode = localStorage.getItem('fw_mode') || 'f'; } catch (e) {}
const units = () => cards.flatMap(c => (mode === 'mix' ? ['f', 'r'] : [mode]).map(dir => ({ c, dir })));
const dueUnits = () => units().filter(u => u.c[u.dir].d <= Date.now());
function pick() {
  let list = dueUnits();
  if (!list.length && extra) list = units();
  if (!list.length) return null;
  const other = list.filter(u => u.c.id !== lastId); if (other.length) list = other;
  const min = Math.min(...list.map(u => u.c[u.dir].b));
  const low = list.filter(u => u.c[u.dir].b === min);
  return low[Math.floor(Math.random() * low.length)];
}
const nextIn = () => {
  const h = Math.ceil((Math.min(...units().map(u => u.c[u.dir].d)) - Date.now()) / 36e5);
  return h < 24 ? `через ${Math.max(1, h)} ч` : `через ${Math.round(h / 24)} дн.`;
};

/* ---------- озвучка и транскрипция ---------- */
function speak(t) {
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .9;
    const v = speechSynthesis.getVoices().find(v => v.lang.replace('_', '-').startsWith('en-US')) || speechSynthesis.getVoices().find(v => v.lang.startsWith('en'));
    if (v) u.voice = v; speechSynthesis.speak(u);
  } catch (e) {}
}
async function ensureIpa(c) {
  if (c.ipa !== undefined) return;
  const words = c.en.toLowerCase().replace(/^to\s+/, '').replace(/[^a-z'\s-]/g, '').trim().split(/\s+/).filter(Boolean).slice(0, 4);
  let out = [];
  try {
    for (const w of words) {
      const r = await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/' + encodeURIComponent(w));
      if (!r.ok) { out = null; break; }
      const e = (await r.json())[0];
      const p = e.phonetic || (e.phonetics.find(x => x.text) || {}).text;
      if (!p) { out = null; break; }
      out.push(p.replace(/^\/|\/$/g, ''));
    }
  } catch (e) { return; } // нет сети — попробуем позже
  c.ipa = out && out.length ? '/' + (/^to\s/i.test(c.en) ? 'tə ' : '') + out.join(' ') + '/' : '';
  store.save(c);
  if (cur && cur.c === c) document.querySelectorAll('.ipa').forEach(n => n.textContent = c.ipa);
}

/* ---------- экраны ---------- */
function render() {
  $('#t-study').setAttribute('aria-selected', tab === 'study');
  $('#t-words').setAttribute('aria-selected', tab === 'words');
  tab === 'study' ? renderStudy() : renderWords();
}
function emptyState() {
  $('#view').innerHTML = `<div class="empty"><h2>Пока нет карточек</h2><p>Добавь свои слова или начни со стартового набора из 10 слов.</p>
  <button class="btn acc" id="seed">Добавить стартовый набор</button><button class="btn" id="own">Создать свою карточку</button></div>`;
  $('#seed').onclick = () => { STARTER.forEach(([en, ru, ex]) => addCard(en, ru, ex)); render(); };
  $('#own').onclick = () => openSheet();
}
function statHTML() {
  const U = units(), cb = cur && cur.c[cur.dir].b;
  return `<div class="boxes">${[1, 2, 3, 4, 5].map(n => `<div class="${cb === n ? 'on' : ''}"><b>${U.filter(u => u.c[u.dir].b === n).length}</b>коробка ${n}</div>`).join('')}</div>
  <p class="sub">К повторению сейчас: ${dueUnits().length}</p>`;
}
function head() {
  return `<div class="seg modes">${[['f', 'EN → RU'], ['r', 'RU → EN'], ['mix', 'Микс']].map(([m, t]) => `<button data-mode="${m}" aria-pressed="${mode === m}">${t}</button>`).join('')}</div><div id="stat">${statHTML()}</div>`;
}
function bindHead() {
  document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => {
    mode = b.dataset.mode; try { localStorage.setItem('fw_mode', mode); } catch (e) {}
    cur = null; extra = false; renderStudy();
  });
}

function renderStudy() {
  if (!cards.length) return emptyState();
  if (!cur) { cur = pick(); tries = 0; hintOn = false; }
  if (!cur) {
    $('#view').innerHTML = head() + `<div class="empty"><h2>На сегодня всё</h2><p>Следующее повторение ${nextIn()}. Регулярность важнее длины занятия.</p>
      <button class="btn" id="more">Повторить всё равно</button></div>`;
    bindHead(); $('#more').onclick = () => { extra = true; renderStudy(); }; return;
  }
  const c = cur.c, fw = cur.dir === 'f';
  const spk = `<button class="spk" aria-label="Озвучить" data-say>${SPK}</button>`, ipa = `<p class="ipa">${esc(c.ipa || '')}</p>`;
  const front = fw ? `<p class="cap">Переведи на русский</p><h2 class="word">${esc(c.en)}</h2>${ipa}${spk}<p class="hint" id="hint"></p>`
    : `<p class="cap">Переведи на английский</p><h2 class="word">${esc(c.ru)}</h2><p class="hint" id="hint"></p>`;
  const back = fw ? `<p class="cap">Перевод</p><h2 class="word">${esc(c.ru)}</h2><p class="en">${esc(c.en)}</p>`
    : `<p class="cap">Перевод</p><h2 class="word">${esc(c.en)}</h2>${ipa}${spk}<p class="en">${esc(c.ru)}</p>`;
  $('#view').innerHTML = head() + `
    <div class="scene"><div class="card" id="card"><div class="face front">${front}</div>
      <div class="face back">${back}${c.ex ? `<p class="ex">${esc(c.ex)}</p>` : ''}</div></div></div>
    <div class="controls" id="ctl">
      <input class="field" id="ans" lang="${fw ? 'ru' : 'en'}" placeholder="${fw ? 'Введи перевод' : 'Введи по-английски'}" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <p class="msg" id="msg"></p>
      <button class="btn acc" id="check">Проверить</button>
      <div class="row"><button class="link" id="hintBtn">Подсказка</button><button class="link" id="giveup">Показать ответ</button></div>
    </div>`;
  bindHead();
  document.querySelectorAll('[data-say]').forEach(b => b.onclick = e => { e.stopPropagation(); speak(c.en); });
  const ans = $('#ans');
  ans.onkeydown = e => { if (e.key === 'Enter') check(); };
  $('#check').onclick = check;
  $('#giveup').onclick = () => reveal(false);
  $('#hintBtn').onclick = () => {
    const v = (fw ? c.ru : c.en).split(/[,;/]/)[0].trim();
    $('#hint').textContent = v[0] + ' ' + '• '.repeat(Math.max(0, v.length - 1)).trim();
    hintOn = true; ans.focus();
  };
  ans.focus({ preventScroll: true });
  ensureIpa(c);
}

function isOk(v) {
  const c = cur.c;
  if (cur.dir === 'f') return v === norm(c.ru) || c.ru.split(/[,;/]/).map(norm).includes(v);
  return c.en.split(/[,;/]/).map(norm).some(a => a && strip(a) === strip(v));
}
function check() {
  const v = norm($('#ans').value);
  if (!v) return;
  if (isOk(v)) return reveal(true);
  tries++; buzz('error');
  const card = $('#card'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
  $('#ans').classList.add('bad');
  $('#msg').className = 'msg bad'; $('#msg').textContent = 'Не совсем. Попробуй ещё раз';
  setTimeout(() => $('#ans') && $('#ans').classList.remove('bad'), 700);
}
function reveal(correct) {
  const u = cur.c[cur.dir], clean = correct && tries === 0 && !hintOn;
  let note = '';
  if (!extra) {
    schedule(u, clean ? Math.min(5, u.b + 1) : correct ? u.b : 1);
    store.save(cur.c);
    note = ` · коробка ${u.b}, ${DAYS[u.b - 1] ? 'повтор через ' + DAYS[u.b - 1] + ' дн.' : 'повтор в этой сессии'}`;
  }
  if (correct) buzz('success');
  $('#card').classList.add('flip');
  $('#ctl').innerHTML = `<p class="msg ${correct ? 'ok' : ''}">${correct ? (clean ? 'Верно!' : 'Верно, но с подсказкой или ошибкой') : 'Вернётся в коробку 1'}${note}</p>
    <button class="btn acc" id="next">Дальше</button>`;
  const n = $('#next'); n.focus(); n.onclick = next;
  $('#stat').innerHTML = statHTML();
  speak(cur.c.en);
}
function next() {
  lastId = cur.c.id; cur = null;
  $('#card').classList.remove('flip');
  setTimeout(renderStudy, 250);
}

function renderWords() {
  if (!cards.length) return emptyState();
  const list = [...cards].sort((a, b) => b.t - a.t).map(c => `
    <button class="item" data-id="${c.id}"><div><b>${esc(c.en)} <span>${esc(c.ipa || '')}</span></b><span>${esc(c.ru)}</span></div>
    <div class="dots" title="Коробка Лейтнера">${[1, 2, 3, 4, 5].map(n => `<i class="${Math.min(c.f.b, c.r.b) >= n ? 'on' : ''}"></i>`).join('')}</div></button>`).join('');
  $('#view').innerHTML = `<div class="top"><h1>Слова · ${cards.length}</h1><button class="add" id="add">Добавить</button></div>${list}`;
  $('#add').onclick = () => openSheet();
  document.querySelectorAll('.item').forEach(b => b.onclick = () => openSheet(cards.find(c => c.id === b.dataset.id)));
}

/* ---------- добавление / редактирование ---------- */
function addCard(en, ru, ex) {
  const c = migrate({ id: uid(), en: en.trim(), ru: ru.trim(), ex: (ex || '').trim(), t: Date.now() + cards.length });
  cards.push(c); store.save(c); ensureIpa(c); return c;
}
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.textContent = t; document.body.append(el); setTimeout(() => el.remove(), 1800); }

function openSheet(card) {
  let m = 'one';
  const el = document.createElement('div'); el.className = 'wrap';
  const draw = () => {
    el.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">
      <h3>${card ? 'Изменить карточку' : 'Новая карточка'}</h3>
      ${card ? '' : `<div class="seg"><button data-m="one" aria-pressed="${m === 'one'}">Одна</button><button data-m="many" aria-pressed="${m === 'many'}">Списком</button></div>`}
      ${m === 'one' ? `
        <input class="field" id="f-en" placeholder="Слово по-английски" autocapitalize="off" autocomplete="off" value="${card ? esc(card.en) : ''}">
        <input class="field" id="f-ru" placeholder="Перевод (несколько через запятую)" autocomplete="off" value="${card ? esc(card.ru) : ''}">
        <input class="field" id="f-ex" placeholder="Пример предложения (необязательно)" autocomplete="off" value="${card ? esc(card.ex || '') : ''}">`
      : `<textarea class="field" id="f-bulk" placeholder="Каждое слово с новой строки:&#10;apple - яблоко&#10;to run - бегать, бежать" autocapitalize="off"></textarea>`}
      <button class="btn acc" id="save">Сохранить</button>
      ${card ? '<button class="danger" id="del">Удалить карточку</button>' : ''}
      <button class="link" id="cancel">Отмена</button></div>`;
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = () => { m = b.dataset.m; draw(); });
    el.querySelector('#cancel').onclick = close; el.querySelector('#save').onclick = save;
    const d = el.querySelector('#del'); if (d) d.onclick = remove;
    const f = el.querySelector('#f-en') || el.querySelector('#f-bulk'); f && f.focus();
  };
  const close = () => el.remove();
  const save = () => {
    if (m === 'one') {
      const en = el.querySelector('#f-en').value.trim(), ru = el.querySelector('#f-ru').value.trim(), ex = el.querySelector('#f-ex').value.trim();
      if (!en || !ru) return toast('Заполни слово и перевод');
      if (card) { if (card.en !== en) { delete card.ipa; } Object.assign(card, { en, ru, ex }); store.save(card); ensureIpa(card); } else addCard(en, ru, ex);
      toast('Сохранено');
    } else {
      const lines = el.querySelector('#f-bulk').value.split('\n').map(l => l.split(/\s+[-–—]\s+|\t|;|=/).map(s => s.trim())).filter(p => p[0] && p[1]);
      if (!lines.length) return toast('Формат: слово - перевод');
      lines.forEach(p => addCard(p[0], p[1], p[2])); toast('Добавлено: ' + lines.length);
    }
    close(); cur = null; render();
  };
  const remove = () => {
    const go = ok => { if (!ok) return; cards = cards.filter(c => c !== card); store.remove(card.id); local(); close(); cur = null; render(); };
    tg && tg.showConfirm && inTg ? tg.showConfirm('Удалить карточку «' + card.en + '»?', go) : go(confirm('Удалить карточку?'));
  };
  el.onclick = e => { if (e.target === el) close(); };
  draw(); document.body.append(el);
}

$('#t-study').onclick = () => { tab = 'study'; render(); };
$('#t-words').onclick = () => { tab = 'words'; render(); };
try { speechSynthesis.getVoices(); } catch (e) {}
store.load().then(c => { cards = c.map(migrate); render(); });
</script>
</body>
</html>
